server {
    listen 80;
    listen [::]:80;
    server_name lovelxr.site www.lovelxr.site;

    server_tokens off;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lovelxr.site www.lovelxr.site;

    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/lovelxr.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lovelxr.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/agent-proxy.inc;
}
