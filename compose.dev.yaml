# Local dependencies only. Does not modify the production compose.yaml stack.
name: ziwei-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ziwei
      POSTGRES_USER: ziwei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ziwei_dev}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ziwei -d ziwei']
      interval: 5s
      timeout: 3s
      retries: 20
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
  elasticsearch-data:
